<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="checkGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="dotGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="45%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>
  </defs>

  <!--
    THE NIXIFY MARK

    One shape. Two meanings.

    • The dot = @ = email, connection, digital identity
    • The checkmark = ✓ = verified, trusted, approved
    • Together = verified email = Nixify

    A bold, stripped-down symbol with subtle depth.
    Like the Nike swoosh — one shape, instantly recognized.
  -->

  <!-- Soft ambient glow behind the dot -->
  <circle cx="50" cy="70" r="18" fill="#34d399" opacity="0.06"/>

  <!-- Ambient glow behind the entire mark -->
  <ellipse cx="50" cy="52" rx="42" ry="32" fill="#34d399" opacity="0.03"/>

  <!-- Checkmark — bold, confident, sweeping stroke -->
  <path
    d="M 22 28 L 44 70"
    stroke="url(#checkGrad)"
    stroke-width="6"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M 56 70 L 78 34"
    stroke="url(#checkGrad)"
    stroke-width="6"
    stroke-linecap="round"
    fill="none"
  />

  <!-- The node — @ = email, the connection point between sender and recipient -->
  <!-- Outer glow ring -->
  <circle cx="50" cy="70" r="13" fill="#34d399" opacity="0.12"/>
  <!-- Main dot with 3D radial gradient (light source from top-left) -->
  <circle cx="50" cy="70" r="11" fill="url(#dotGrad)"/>
  <!-- Spherical highlight — simulates a glossy, polished surface -->
  <ellipse cx="46" cy="66" rx="4.5" ry="3" fill="#a7f3d0" opacity="0.35" transform="rotate(-25 46 66)"/>
  <!-- Soft secondary highlight (rim light) -->
  <ellipse cx="44.5" cy="68.5" rx="2" ry="1.5" fill="#d1fae5" opacity="0.2" transform="rotate(-30 44.5 68.5)"/>
</svg>
