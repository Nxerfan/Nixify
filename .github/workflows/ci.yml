# CI Pipeline — runs on every PR and push to main.
# Checks: TypeScript, ESLint, build, tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: ESLint
        run: bun run lint

      - name: Unit tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "file:./test.db"
          JWT_SECRET: "ci-test-secret-32-bytes-hex-placeholder"
          OTP_PEPPER: "ci-test-pepper-32-bytes-hex-placeholder"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
