# CI Pipeline — runs on every PR and push to main.
# Uses canonical package.json scripts to ensure Vercel/CI parity.
# Includes a build config regression guard and isolated PostgreSQL for integration tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    env:
      OTP_PEPPER: "ci-test-pepper-32-bytes-hex-placeholder!!"
      JWT_SECRET: "ci-test-jwt-secret-32-bytes-hex-placeholder!!"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build config regression guard
        run: bun run verify:config

      - name: TypeScript check
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Unit tests (no DB required)
        run: bun run test

  contacts-integration:
    name: Contacts Integration Tests
    runs-on: ubuntu-latest
    env:
      OTP_PEPPER: "ci-test-pepper-32-bytes-hex-placeholder!!"
      JWT_SECRET: "ci-test-jwt-secret-32-bytes-hex-placeholder!!"
      TEST_DATABASE_URL: "postgresql://nixify_test:nixify_test@localhost:5432/nixify_test"
      RUN_CONTACT_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nixify_test
          POSTGRES_PASSWORD: nixify_test
          POSTGRES_DB: nixify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations to test DB
        run: DATABASE_URL="$TEST_DATABASE_URL" bunx prisma migrate deploy

      - name: Run Contact integration tests (fail-closed — no skips allowed)
        run: bun run test:contacts
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

