# CI Pipeline — runs on every PR and push to main.
# Uses canonical package.json scripts to ensure Vercel/CI parity.
# Includes a build config regression guard.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build config regression guard
        run: bun run verify:config

      - name: TypeScript check
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Unit tests
        run: bun run test

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Next.js production build
        run: bun run build
        env:
          DATABASE_URL: "file:./test.db"
          JWT_SECRET: "ci-test-secret-32-bytes-hex-placeholder"
          OTP_PEPPER: "ci-test-pepper-32-bytes-hex-placeholder"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
