# CD Pipeline — deploys to Vercel on push to main.
#
# Deployment order:
#   1. migrate  — apply committed Prisma migrations to production via
#                 `prisma migrate deploy`. Runs ONLY on pushes to main
#                 (never on PR/preview). FAILS CLOSED: if the
#                 PRODUCTION_DATABASE_URL secret is absent/empty, the migrate
#                 job FAILS (exit non-zero), which blocks the dependent deploy
#                 job. A normal main production deployment NEVER continues when
#                 the required production migration credential is absent.
#                 Never prints DATABASE_URL / username / password / hostname.
#   2. deploy   — build + deploy to Vercel via the Vercel CLI. Depends on
#                 `migrate` (needs: [migrate]), so a migration failure or a
#                 missing-credential failure prevents the deploy.
#
# Requires GitHub secrets:
#   - VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID  (for the Vercel CLI)
#   - PRODUCTION_DATABASE_URL                          (for `prisma migrate deploy`)
#
# Secret handling:
#   - PRODUCTION_DATABASE_URL is passed through the step/job `env:` map and
#     inspected inside the shell as the environment variable
#     PRODUCTION_DATABASE_URL — it is NEVER interpolated directly into shell
#     source via `${{ secrets.* }}`.
#   - No command prints the DB secret value, username, password, hostname, or
#     any connection-string fragment.
#
# Migration safety (docs/engineering/reliability-protocol.md §6):
#   - production schema evolution uses `prisma migrate deploy` ONLY.
#   - NEVER `prisma db push`, `prisma migrate reset`, or `prisma migrate dev`.
#   - migrations run exactly ONCE per deployment workflow (this job), NOT during
#     every serverless function startup.
#   - no automatic production seeding — production deploy must not create or
#     overwrite application/admin/test data.

name: Deploy

on:
  push:
    branches: [main]

jobs:
  migrate:
    name: Production database migration (prisma migrate deploy)
    runs-on: ubuntu-latest
    # Runs only on pushes to main (workflow trigger already enforces this).
    # Never runs on PR/preview CI — this is a separate workflow from ci.yml.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Fail closed if PRODUCTION_DATABASE_URL is absent
        # Pass the secret through the step env map and inspect it as an
        # environment variable. NEVER interpolate the secret directly into
        # shell source (no `${{ secrets.PRODUCTION_DATABASE_URL }}` in `run:`).
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          # Inspect the environment variable, NOT the GitHub expression.
          # Absent or empty -> fail closed (exit 1) so the deploy job cannot run.
          if [ -z "${PRODUCTION_DATABASE_URL:-}" ]; then
            echo "::error::PRODUCTION_DATABASE_URL secret is not set. Production CD requires this secret to run 'prisma migrate deploy'. A normal main deployment NEVER continues when the required production migration credential is absent. Configure the PRODUCTION_DATABASE_URL GitHub secret (Neon direct connection string — see DEPLOY.md) and re-run. Manual migration is an explicit emergency operator procedure, not an automatic fallback that permits CD to continue."
            exit 1
          fi
          echo "PRODUCTION_DATABASE_URL is configured — proceeding with migration verification."

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Apply production migrations (prisma migrate deploy)
        # Map PRODUCTION_DATABASE_URL to DATABASE_URL via env: (no shell
        # interpolation). Prisma reads DATABASE_URL; it does not echo it.
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          # Migration failure stops deployment (set -e is implicit in `run`).
          # Never print DATABASE_URL — guard against accidental echoes.
          bunx prisma migrate deploy
          echo "✓ Production migrations applied via 'prisma migrate deploy'."

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # Deploy waits for migrations so a failed migration OR a missing-credential
    # failure blocks the deploy (the migrate job fails in both cases).
    needs: [migrate]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Vercel CLI
        run: bun add -g vercel

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
