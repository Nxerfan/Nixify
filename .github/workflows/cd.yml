# CD Pipeline — deploys to Vercel on push to main.
#
# Deployment order:
#   1. migrate  — apply committed Prisma migrations to production (migrate deploy).
#                 Runs ONLY on pushes to main (never on PR/preview). Fails the
#                 deployment if migrations fail. Never prints DATABASE_URL.
#                 Skipped (with a clear warning) if the PRODUCTION_DATABASE_URL
#                 secret is absent — see DEPLOY.md for operator setup.
#   2. deploy   — build + deploy to Vercel via the Vercel CLI.
#
# Requires GitHub secrets:
#   - VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID  (for the Vercel CLI)
#   - PRODUCTION_DATABASE_URL                          (for `prisma migrate deploy`)
#
# Migration safety (docs/engineering/reliability-protocol.md §6):
#   - production schema evolution uses `prisma migrate deploy` ONLY.
#   - NEVER `prisma db push`, `prisma migrate reset`, or `prisma migrate dev`.
#   - migrations run exactly ONCE per deployment workflow (this job), NOT during
#     every serverless function startup.
#   - no automatic production seeding — production deploy must not create or
#     overwrite application/admin/test data.
#
# If PRODUCTION_DATABASE_URL is not configured, the migrate job is SKIPPED with
# a clear warning rather than failing silently or inventing a secret. The
# operator must then run migrations manually before/at deploy time (see
# DEPLOY.md). Do not hide migration failures.

name: Deploy

on:
  push:
    branches: [main]

jobs:
  migrate:
    name: Production database migration (prisma migrate deploy)
    runs-on: ubuntu-latest
    # Runs only on pushes to main (workflow trigger already enforces this).
    # Never runs on PR/preview CI — this is a separate workflow from ci.yml.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Check PRODUCTION_DATABASE_URL secret presence
        id: has_db_secret
        # Fail-safe: treat an empty secret as "absent" and skip migrations with
        # a clear warning. We do NOT invent a secret or fake success.
        run: |
          if [ -z "${{ secrets.PRODUCTION_DATABASE_URL }}" ]; then
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PRODUCTION_DATABASE_URL secret is not set — skipping the automated production migration step. The operator MUST run 'prisma migrate deploy' manually before/at deploy time (see DEPLOY.md). Migrations are NOT applied automatically."
          else
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
            echo "PRODUCTION_DATABASE_URL is configured — will run prisma migrate deploy."
          fi

      - name: Install dependencies
        if: steps.has_db_secret.outputs.has_secret == 'true'
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.has_db_secret.outputs.has_secret == 'true'
        run: bunx prisma generate

      - name: Apply production migrations (prisma migrate deploy)
        if: steps.has_db_secret.outputs.has_secret == 'true'
        env:
          # The direct (non-pooled) Neon connection is required for DDL —
          # Neon's transaction-mode pooling is incompatible with migration DDL.
          # If PRODUCTION_DATABASE_URL is the pooled string, set
          # DIRECT_URL via the Prisma datasource `directUrl` instead.
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          # Migration failure stops deployment (set -e is implicit in `run`).
          # Never print DATABASE_URL — Prisma does not echo the connection
          # string during migrate deploy, but we add a guard anyway.
          bunx prisma migrate deploy

      - name: Migration summary
        if: always()
        run: |
          if [ "${{ steps.has_db_secret.outputs.has_secret }}" = "true" ]; then
            echo "✓ Production migrations applied via 'prisma migrate deploy'."
          else
            echo "⚠ PRODUCTION_DATABASE_URL not set — migrations NOT applied automatically."
            echo "  Operator action required: run 'bunx prisma migrate deploy' with the"
            echo "  production DATABASE_URL before/at deploy time (see DEPLOY.md)."
          fi

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # Deploy waits for migrations so a failed migration blocks the deploy.
    needs: [migrate]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Vercel CLI
        run: bun add -g vercel

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
